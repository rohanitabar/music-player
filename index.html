<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A lightweight music player for a six-track playlist." />
    <link rel="stylesheet" href="./assets/css/all.min.css" />
    <link rel="stylesheet" href="./assets/css/svg-with-js.min.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <script src="./assets/js/all.min.js" defer></script>
    <script src="./assets/js/app.js" defer></script>
    <meta name="theme-color" content="#090b12" />
    <title>Sonora - Music Player</title>
  </head>

  <body>
    <main class="app-shell">
      <header class="app-header">
        <a class="brand" href="./" aria-label="Sonora home">
          <span class="brand-mark"><i class="fas fa-wave-square" aria-hidden="true"></i></span>
          <span class="brand-copy">
            <span class="brand-name">SONORA</span>
            <span class="brand-tagline">YOUR MUSIC, YOUR MOMENT</span>
          </span>
        </a>
        <span class="local-status"><span class="status-dot"></span> YOUR MUSIC LIBRARY</span>
      </header>

      <section class="player-card" id="music-container" aria-label="Music player">
        <div class="artwork-panel">
          <div class="artwork-glow" aria-hidden="true"></div>
          <div class="artwork-disc">
            <div class="img-container" id="cover">
              <img src="./img/Koohe-Ghaf.jpg" id="img-1" alt="Koohe Ghaf album cover" />
              <img src="./img/Eshghemoon.jpg" id="img-2" alt="Eshghemoon album cover" hidden />
              <img src="./img/Emperatoore-Divooneha.jpg" id="img-3" alt="Emperatoore Divooneha album cover" hidden />
              <img src="./img/Baladam-Boodi.jpg" id="img-4" alt="Baladam Boodi album cover" hidden />
              <img src="./img/2ta-Cheshat.jpg" id="img-5" alt="2ta Cheshat album cover" hidden />
              <img src="./img/Rasti-Rasti.jpg" id="img-6" alt="Rasti Rasti album cover" hidden />
            </div>
          </div>
          <div class="artwork-caption">
            <span class="equalizer" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span>NOW PLAYING</span>
          </div>
        </div>

        <div class="player-content">
          <div class="track-heading">
            <p class="eyebrow">ON YOUR PLAYLIST</p>
            <h1 id="title" aria-live="polite">Koohe Ghaf</h1>
            <p class="track-subtitle">A little space to get lost in the music.</p>
          </div>

          <div class="timeline">
            <div
              class="progress-container"
              id="progress-container"
              role="slider"
              tabindex="0"
              aria-label="Seek through track"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div class="progress-fill" id="progress"></div>
              <div class="circle" aria-hidden="true"></div>
            </div>
            <div class="time" aria-live="off">
              <span id="currTime">0:00</span>
              <span id="durTime">0:00</span>
            </div>
          </div>

          <div class="transport" aria-label="Playback controls">
            <button class="transport-button secondary" id="prev" type="button" aria-label="Previous track">
              <i class="fas fa-backward-step" aria-hidden="true"></i>
            </button>
            <button class="play-button" id="play" type="button" aria-label="Play">
              <i class="fas fa-play" aria-hidden="true"></i>
            </button>
            <button class="transport-button secondary" id="next" type="button" aria-label="Next track">
              <i class="fas fa-forward-step" aria-hidden="true"></i>
            </button>
          </div>

          <div class="volume-row">
            <button class="volume-button" id="volume-icon" type="button" aria-label="Mute" aria-pressed="false">
              <i class="fas fa-volume-high" aria-hidden="true"></i>
            </button>
            <label class="volume-label" for="volume">VOLUME</label>
            <input
              type="range"
              class="volume"
              id="volume"
              min="0"
              max="1"
              step="0.01"
              value="1"
              aria-label="Volume"
            />
            <span class="volume-value" id="volume-value">100%</span>
          </div>
        </div>
        <audio id="audio" preload="metadata"></audio>
      </section>

      <p class="page-note"><i class="fas fa-headphones" aria-hidden="true"></i> Take a breath. Press play.</p>
    </main>
  </body>
</html>
